# SOPS configuration for the incus-lab cluster's secrets.
#
# Path follows nixcluster's `clusterModules.sops` convention: the config file
# lives inside `sops.secretsDir` (default "secrets"), alongside
# `<cluster>.yaml` (see cluster-modules/sops.nix upstream, `sopsConfigFile`).
#
# The PRIVATE half of this age keypair is NOT committed — it was written to
# the scratchpad at fixture-build time and is what NIO mounts at
# NixCluster.spec.ageKeyRef, delivered to each member at /etc/age/key.txt via
# `nixclusterctl incus-lab install <member> --age-key-file ...`
# (--extra-files, outside the nix store).
keys:
  - &incus-lab age1v58lewn9lgskj5h8umfta4anspxskhgercqhcf9nelxrvjc43vjswrsxtp
creation_rules:
  - path_regex: incus-lab\.yaml$
    key_groups:
      - age:
          - *incus-lab
